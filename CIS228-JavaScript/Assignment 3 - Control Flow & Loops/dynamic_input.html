<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control Flows and Loops - Assignment</title>
    <link rel="stylesheet" href="styles.css" />
    <!--     
      Filename: dynamic_input.html
      Institution: Muskegon Community College
      Semester: Fall 2026
      CIS-228-F01X JavaScript
      Assignment 3 Control Flow and Looping
      Author: Chris Grimm
      Date: 9/19/26
      Description: HTML that provides the framework for input boxes so a user
        can determine if a number is positive or negative; and the day of the week from a number.
    -->
  </head>
  <body>
    <header>
      <h1>Control Flows and Loops in JavaScript</h1>
    </header>

    <main>
      <section id="if-else">
        <h2>If-Else: Positive or Negative Number</h2>
        <p>Enter a number to check if it is positive, negative, or zero.</p>
        <input type="number" id="num-input" placeholder="Enter a number" />
        <button onclick="runIfElse()">Run</button>
        <div id="if-else-output" class="output"></div>
      </section>

      <section id="switch">
        <h2>Switch: Day of the Week</h2>
        <p>Enter a day number (0-6) to see the corresponding day name.</p>
        <input type="number" id="day-input" placeholder="Enter day (0-6)" />
        <button onclick="runSwitch()">Run</button>
        <div id="switch-output" class="output"></div>
      </section>
    </main>

    <footer>
      <p>JavaScript Control Flow and Looping</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
